<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Dashboard</title>
<style>
:root{--bg-sidebar:#0f1420;--bg-main:#151b2c;--bg-panel:#1b2338;--bg-card:#212a44;--border:#2a3350;--accent:#3b82f6;--text-main:#e7ebf3;--text-dim:#8b94ad;--green:#37b24d;--yellow:#f2c94c;--red:#eb5757;--purple:#9b59d0;--blue:#56ccf2}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:var(--bg-main);color:var(--text-main);min-height:100vh;display:flex}button,input{font:inherit}h1,h2,h3,p{margin:0}
.sidebar{width:210px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;min-height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 20px;font-weight:700}.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.nav-item{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--text-dim);cursor:pointer;margin-bottom:4px;border:0;background:transparent;width:100%;text-align:left}.nav-item:hover{background:#ffffff0d;color:#fff}.nav-item.active{background:var(--accent);color:#fff}.nav-item.disabled{opacity:.35;cursor:default}.sidebar-footer{margin-top:auto}.mini-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12px;color:var(--text-dim)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg-sidebar)}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:14px}.online-pill{font-size:12px;color:var(--text-dim)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.profile-btn{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;cursor:pointer}.header-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#2a3350}.header-avatar svg{width:130%;height:130%;margin:-18% 0 0 -15%}
.content{flex:1;display:flex;gap:18px;padding:20px;overflow:auto}.view{display:none;flex:1;min-width:0}.view.active{display:flex;flex-direction:column;gap:14px}
.office-scene{flex:1;background:linear-gradient(180deg,#1a2136,#171d30);border:1px solid var(--border);border-radius:16px;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;align-content:start}
.desk-card{text-align:center}.task-bubble{background:#fff;color:#333;font-size:11px;border-radius:10px;padding:7px;margin-bottom:8px;min-height:34px}.desk-avatar{background:#232c47;border:2px solid var(--border);border-radius:12px;padding:6px}.desk-avatar svg{width:100%;aspect-ratio:3/4}.name{font-size:12px;font-weight:700;margin-top:6px}.role{font-size:11px;color:var(--text-dim)}.status-pill{display:inline-block;margin-top:4px;font-size:10px;padding:3px 8px;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--text-dim)}
.side-panel{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;padding:16px}.panel h3{font-size:12px;color:var(--accent);margin-bottom:10px}.summary-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.announce-item{font-size:12px;padding:8px 0;border-bottom:1px solid var(--border)}.announce-form{display:flex;gap:6px;margin-top:10px}.announce-form input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:#fff;padding:8px}.announce-form button{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:0 12px}
.name-gate{flex:1;display:flex;align-items:center;justify-content:center}.login-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:18px;padding:30px;max-width:350px;text-align:center}.login-card p{font-size:12px;color:var(--text-dim);margin:10px 0}.login-card input{width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:#fff}.login-btn{width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.game-container{display:flex;gap:20px;flex-wrap:wrap}.stage{flex:1;min-width:240px;display:flex;flex-direction:column;align-items:center}.canvas-wrap{width:230px;height:306px;background:#232c47;border:2px solid var(--border);border-radius:16px;overflow:hidden}.canvas-wrap svg{width:100%;height:100%}.controls{flex:1.3;min-width:260px;display:flex;flex-direction:column;gap:12px}.section{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:12px}.options{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-dim);cursor:pointer}.btn.active{background:var(--accent);color:#fff}.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swatch.active{border-color:var(--accent)}
#taskTextInput{width:100%;margin-top:8px;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:#fff}.action{width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.random{background:var(--bg-card);color:#fff}.save{background:var(--green);color:#fff}
.members-table{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;padding:8px}.member-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px}.member-row:hover{background:#ffffff0b}.member-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#2a3350}.member-avatar svg{width:130%;height:130%;margin:-18% 0 0 -15%}.member-task{flex:1;color:var(--text-dim);font-size:12px}
@media(max-width:900px){body{display:block}.sidebar{width:100%;min-height:auto;flex-direction:row;overflow:auto}.brand,.sidebar-footer{display:none}.main{min-height:100vh}.content{flex-direction:column}.side-panel{width:100%}}
</style>
</head>
<body>
<aside class="sidebar">
<div class="brand"><span class="brand-dot"></span> OFFICE DASHBOARD</div>
<button class="nav-item active" data-view="office">🏠 Office</button>
<button class="nav-item" data-view="myavatar">🎨 My Avatar</button>
<button class="nav-item" data-view="members">👥 Members</button>
<button class="nav-item disabled">📋 Task Board</button>
<button class="nav-item disabled">📅 Calendar</button>
<div class="sidebar-footer"><div class="mini-card">ตั้งค่าตัวละครและสถานะได้ที่ My Avatar</div></div>
</aside>

<div class="main">
<header class="topbar">
<div class="topbar-left"><b>OFFICE DASHBOARD</b><span class="online-pill"><span class="dot"></span>ONLINE <b id="onlineCount">0</b></span></div>
<div class="topbar-right"><button class="profile-btn" id="profileBtn"><span class="header-avatar"><svg viewBox="70 40 160 160" id="headerAvatar"></svg></span><span id="headerName">ยังไม่ตั้งชื่อ</span></button></div>
</header>

<div class="content">
<section class="view active" id="officeView">
<div class="office-scene" id="officeScene"></div>
<div class="legend" id="legend"></div>
</section>

<section class="view" id="myavatarView">
<div class="name-gate" id="nameGate">
<div class="login-card">
<h2>👋 ตั้งชื่อของคุณก่อน</h2>
<p>ข้อมูลจะถูกเก็บไว้ในเบราว์เซอร์เครื่องนี้</p>
<input id="usernameInput" placeholder="ชื่อพนักงาน">
<input id="roleInput" placeholder="ตำแหน่ง">
<button class="login-btn" id="setNameBtn">เริ่มแต่งตัว</button>
</div>
</div>
<div class="game-container" id="customize" style="display:none">
<div class="stage">
<div class="canvas-wrap"><svg viewBox="0 0 300 400" id="charSvg"></svg></div>
<div id="summary" class="role" style="margin-top:8px"></div>
<button class="action random" id="randomBtn">🎲 สุ่มลุคใหม่</button>
<button class="action save" id="saveBtn">💾 บันทึกลุคและสถานะ</button>
<div id="saveStatus" class="role" style="margin-top:6px"></div>
</div>
<div class="controls">
<div class="section"><h3>💬 สถานะปัจจุบัน</h3><div class="options" id="statusOptions"></div><input id="taskTextInput" placeholder="กำลังทำอะไรอยู่?"></div>
<div class="section"><h3>👗 ชุด</h3><div class="options" id="outfitOptions"></div></div>
<div class="section"><h3>🎨 สีผิว</h3><div class="options" id="skinOptions"></div></div>
<div class="section"><h3>💇 ทรงผม</h3><div class="options" id="hairOptions"></div></div>
<div class="section"><h3>🌈 สีผม</h3><div class="options" id="hairColorOptions"></div></div>
<div class="section"><h3>🎀 เครื่องประดับ</h3><div class="options" id="accessoryOptions"></div></div>
</div>
</div>
</section>

<section class="view" id="membersView"><div class="members-table" id="membersTable"></div></section>

<aside class="side-panel" id="sidePanel">
<div class="panel"><h3>TODAY'S SUMMARY</h3><div id="summaryRows"></div></div>
<div class="panel"><h3>📣 ANNOUNCEMENT</h3><div id="announceList"></div><div class="announce-form"><input id="announceInput" placeholder="ส่งข้อความถึงทีม"><button id="announceBtn">ส่ง</button></div></div>
</aside>
</div>
</div>

<script>
const outfits=[
{name:'เดรสชมพู',color:'#ff8fab',path:'M90 240Q150 220 210 240L220 340Q150 360 80 340Z'},
{name:'เดรสฟ้า',color:'#74c0fc',path:'M90 240Q150 220 210 240L220 340Q150 360 80 340Z'},
{name:'ชุดเหลือง',color:'#ffe066',path:'M90 240Q150 215 210 240L235 345Q150 370 65 345Z'},
{name:'ชุดเจ้าหญิง',color:'#b197fc',path:'M90 235Q150 205 210 235L240 350Q150 380 60 350Z'}];
const skins=['#ffd8b8','#ffe0c2','#f4b183','#c68863','#8d5524'];
const hairColors=['#3b2f2f','#8d5524','#e8b34a','#d6336c','#495057','#ae7bff'];
const hairs=[
{name:'ผมยาว',back:'M90 100Q150 60 210 100L215 260Q195 270 190 250L190 130Q150 100 110 130L110 250Q105 270 85 260Z',front:'M88 140Q90 70 150 65Q210 70 212 140Q210 100 150 95Q90 100 88 140Z'},
{name:'ผมบ๊อบ',back:'M95 110Q150 70 205 110L208 190Q150 210 92 190Z',front:'M88 140Q90 75 150 70Q210 75 212 140Q210 100 150 95Q90 100 88 140Z'},
{name:'หางม้า',back:'M190 130Q230 160 210 240Q195 235 190 200Z',front:'M88 138Q90 68 150 64Q210 68 212 138Q210 96 150 92Q90 96 88 138Z'}];
const accessories=[
{name:'ไม่ใส่',svg:''},
{name:'มงกุฎ',svg:'<path d="M110 92L120 70L135 88L150 65L165 88L180 70L190 92Z" fill="#ffd43b"/>'},
{name:'แว่น',svg:'<rect x="108" y="140" width="34" height="20" rx="8" fill="#343a40"/><rect x="158" y="140" width="34" height="20" rx="8" fill="#343a40"/>'},
{name:'โบว์',svg:'<path d="M150 78L130 65L130 85Z" fill="#ff6b9d"/><path d="M150 78L170 65L170 85Z" fill="#ff6b9d"/>'}];
const statuses=[
{id:'working',label:'กำลังทำงาน',color:'#37b24d'},
{id:'help',label:'ต้องการความช่วยเหลือ',color:'#f2c94c'},
{id:'meeting',label:'ประชุม',color:'#eb5757'},
{id:'away',label:'ไม่อยู่',color:'#9b59d0'},
{id:'break',label:'พักเบรก',color:'#56ccf2'}];

let state={outfit:0,skin:0,hair:0,hairColor:0,accessory:0,status:'working',task:''};
let currentUser=localStorage.getItem('office_current_user')||'';
let currentRole=localStorage.getItem('office_current_role')||'';

function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatar(s){
 const o=outfits[s.outfit]||outfits[0],sk=skins[s.skin]||skins[0],h=hairs[s.hair]||hairs[0],hc=hairColors[s.hairColor]||hairColors[0],a=accessories[s.accessory]||accessories[0];
 return `<path d="${h.back}" fill="${hc}"/><ellipse cx="150" cy="330" rx="70" ry="16" fill="#0003"/><path d="${o.path}" fill="${o.color}"/><ellipse cx="80" cy="270" rx="14" ry="45" fill="${sk}" transform="rotate(-15 80 270)"/><ellipse cx="220" cy="270" rx="14" ry="45" fill="${sk}" transform="rotate(15 220 270)"/><rect x="135" y="180" width="30" height="30" fill="${sk}"/><ellipse cx="150" cy="150" rx="62" ry="66" fill="${sk}"/><ellipse cx="125" cy="150" rx="8" ry="10" fill="#3b2f2f"/><ellipse cx="175" cy="150" rx="8" ry="10" fill="#3b2f2f"/><circle cx="128" cy="146" r="2.5" fill="#fff"/><circle cx="178" cy="146" r="2.5" fill="#fff"/><path d="M135 180Q150 192 165 180" stroke="#d6336c" stroke-width="3" fill="none"/><path d="${h.front}" fill="${hc}"/>${a.svg}`;
}
function profiles(){return JSON.parse(localStorage.getItem('office_profiles')||'[]')}
function saveProfiles(v){localStorage.setItem('office_profiles',JSON.stringify(v))}
function announcements(){return JSON.parse(localStorage.getItem('office_announcements')||'[]')}

function buildButtons(id,items,key){
 const el=document.getElementById(id);el.innerHTML='';
 items.forEach((it,i)=>{const b=document.createElement('button');b.className='btn'+(state[key]===i?' active':'');b.textContent=it.name;b.onclick=()=>{state[key]=i;renderCustomize()};el.appendChild(b)})
}
function buildColors(id,colors,key){
 const el=document.getElementById(id);el.innerHTML='';
 colors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(state[key]===i?' active':'');b.style.background=c;b.onclick=()=>{state[key]=i;renderCustomize()};el.appendChild(b)})
}
function renderCustomize(){
 charSvg.innerHTML=avatar(state);headerAvatar.innerHTML=avatar(state);
 summary.textContent=`${outfits[state.outfit].name} • ${hairs[state.hair].name} • ${accessories[state.accessory].name}`;
 buildButtons('outfitOptions',outfits,'outfit');buildColors('skinOptions',skins,'skin');buildButtons('hairOptions',hairs,'hair');buildColors('hairColorOptions',hairColors,'hairColor');buildButtons('accessoryOptions',accessories,'accessory');
 statusOptions.innerHTML='';statuses.forEach(st=>{const b=document.createElement('button');b.className='btn'+(state.status===st.id?' active':'');b.textContent=st.label;b.onclick=()=>{state.status=st.id;renderCustomize()};statusOptions.appendChild(b)});
 if(document.activeElement!==taskTextInput)taskTextInput.value=state.task||'';
}
function renderOffice(){
 const ps=profiles();onlineCount.textContent=ps.length;
 officeScene.innerHTML=ps.length?ps.map(p=>{const st=statuses.find(x=>x.id===p.status)||statuses[0];return `<div class="desk-card"><div class="task-bubble">${esc(p.task||'ยังไม่ระบุงาน')}</div><div class="desk-avatar"><svg viewBox="0 0 300 400">${avatar(p.state)}</svg></div><div class="name">${esc(p.name)}</div><div class="role">${esc(p.role)}</div><span class="status-pill" style="color:${st.color};border:1px solid ${st.color}">${st.label}</span></div>`}).join(''):'<div class="role">ยังไม่มีสมาชิก ไปที่ My Avatar เพื่อสร้างตัวละคร</div>';
 legend.innerHTML=statuses.map(s=>`<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:5px"></i>${s.label}</span>`).join('');
 summaryRows.innerHTML=`<div class="summary-row"><span>ออนไลน์</span><b>${ps.length} คน</b></div>`+statuses.map(s=>`<div class="summary-row"><span>${s.label}</span><b>${ps.filter(p=>p.status===s.id).length}</b></div>`).join('');
 membersTable.innerHTML=ps.length?ps.map(p=>{const st=statuses.find(x=>x.id===p.status)||statuses[0];return `<div class="member-row"><div class="member-avatar"><svg viewBox="70 40 160 160">${avatar(p.state)}</svg></div><div><div class="name">${esc(p.name)}</div><div class="role">${esc(p.role)}</div></div><div class="member-task">${esc(p.task)}</div><span class="status-pill" style="color:${st.color};border:1px solid ${st.color}">${st.label}</span></div>`}).join(''):'<div class="role" style="padding:30px;text-align:center">ยังไม่มีสมาชิก</div>';
 const anns=announcements();announceList.innerHTML=anns.length?anns.map(a=>`<div class="announce-item"><b>${esc(a.author)}</b><br>${esc(a.text)}</div>`).join(''):'<div class="role">ยังไม่มีประกาศ</div>';
}
function switchView(view){
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(view+'View').classList.add('active');
 document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 sidePanel.style.display=view==='office'?'flex':'none';
}
document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
setNameBtn.onclick=()=>{
 const name=usernameInput.value.trim();if(!name)return;
 currentUser=name;currentRole=roleInput.value.trim();localStorage.setItem('office_current_user',name);localStorage.setItem('office_current_role',currentRole);
 const found=profiles().find(p=>p.name.toLowerCase()===name.toLowerCase());if(found){state={...state,...found.state,status:found.status,task:found.task}}
 nameGate.style.display='none';customize.style.display='flex';headerName.textContent=name;renderCustomize();
};
taskTextInput.oninput=e=>state.task=e.target.value;
randomBtn.onclick=()=>{state.outfit=Math.floor(Math.random()*outfits.length);state.skin=Math.floor(Math.random()*skins.length);state.hair=Math.floor(Math.random()*hairs.length);state.hairColor=Math.floor(Math.random()*hairColors.length);state.accessory=Math.floor(Math.random()*accessories.length);renderCustomize()};
saveBtn.onclick=()=>{
 let ps=profiles();const item={name:currentUser,role:currentRole,state:{outfit:state.outfit,skin:state.skin,hair:state.hair,hairColor:state.hairColor,accessory:state.accessory},status:state.status,task:state.task};
 const i=ps.findIndex(p=>p.name.toLowerCase()===currentUser.toLowerCase());if(i>=0)ps[i]=item;else ps.push(item);saveProfiles(ps);saveStatus.textContent='✅ บันทึกแล้ว';renderOffice();
};
announceBtn.onclick=()=>{const text=announceInput.value.trim();if(!text)return;const a=announcements();a.unshift({author:currentUser||'ไม่ระบุชื่อ',text});localStorage.setItem('office_announcements',JSON.stringify(a.slice(0,10)));announceInput.value='';renderOffice()};
profileBtn.onclick=()=>switchView('myavatar');

if(currentUser){
 const found=profiles().find(p=>p.name.toLowerCase()===currentUser.toLowerCase());if(found)state={...state,...found.state,status:found.status,task:found.task};
 nameGate.style.display='none';customize.style.display='flex';headerName.textContent=currentUser;
}
renderCustomize();renderOffice();
</script>
</body>
</html>
